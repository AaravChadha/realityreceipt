name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API
        run: python -m venv api/.venv && api/.venv/bin/pip install -r api/requirements.txt
      - name: API and analysis tests
        run: api/.venv/bin/python -m pytest api/tests analysis -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        run: npm --prefix web ci
      - name: Web tests
        run: npm --prefix web test
      - name: Web build
        run: npm --prefix web run build
